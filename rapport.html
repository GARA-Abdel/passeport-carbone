<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rapport carbone mensuel | Passeport Carbone</title>
<link rel="stylesheet" href="style.css">
<style>

/* =========================================
   RAPPORT — styles complémentaires
   ========================================= */

.report-hero {
    background: linear-gradient(135deg, #1f5c33 0%, #2a7d44 100%);
    color: white;
    border-radius: 17px;
    padding: 38px 32px;
    margin-bottom: 25px;
    position: relative;
    overflow: hidden;
}

.report-hero .label {
    font-size: 11px;
    letter-spacing: 2px;
    color: #b8e0c4;
    font-weight: 700;
    text-transform: uppercase;
}

.report-hero .big-value {
    font-size: clamp(46px, 8vw, 72px);
    font-weight: 800;
    line-height: 1.05;
    margin: 14px 0 6px;
    letter-spacing: -2px;
}

.report-hero .big-unit {
    font-size: 22px;
    font-weight: 600;
    color: #c8e8d2;
    margin-left: 6px;
}

.report-hero .sub {
    color: #c8e8d2;
    font-size: 14px;
    margin-top: 4px;
}

.report-hero .biogenic {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,0.18);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 15px;
    flex-wrap: wrap;
}

.report-hero .biogenic .val {
    font-size: 22px;
    font-weight: 700;
    color: #e8d99a;
}

.report-hero .biogenic .txt {
    color: #b8e0c4;
    font-size: 12px;
    max-width: 380px;
}

.report-hero .delta {
    display: inline-block;
    margin-top: 20px;
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
}

.delta.down { background: rgba(140,200,155,0.25); color: #e7ffe9; }
.delta.up   { background: rgba(230,140,120,0.25); color: #ffe9e2; }
.delta.flat { background: rgba(200,200,200,0.15); color: #f0f0f0; }

/* Niveaux — vocabulaire descriptif */
.niveau-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 15px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 20px;
}
.niveau-bas           { background: #e3f3e7; color: #1f6d3a; }
.niveau-attendu       { background: #eef3f0; color: #3a5a44; }
.niveau-au-dessus     { background: #fdf3d9; color: #8a6b13; }
.niveau-significatif  { background: #fbe0d8; color: #a8442b; }

.note-transparence {
    margin-top: 22px;
    padding: 14px 16px;
    background: #f6f8f5;
    border-left: 3px solid #b8c8bd;
    border-radius: 6px;
    font-size: 12px;
    color: #536057;
    line-height: 1.55;
    font-style: italic;
}

.top3-item {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: baseline;
    gap: 12px;
    margin-top: 22px;
}
.top3-item .label { font-weight: 700; font-size: 15px; }
.top3-item .value { font-weight: 600; color: #267a42; font-size: 14px; }
.top3-item .bar-wrap {
    grid-column: 1 / -1;
    height: 8px;
    background: #dfe8e0;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 6px;
}
.top3-item .bar-wrap i {
    display: block;
    height: 100%;
    background: #318049;
    border-radius: 20px;
}
.top3-item .pct {
    grid-column: 1 / -1;
    font-size: 12px;
    color: #7a857d;
    margin-top: -2px;
}
.top3-item.rank-1 .bar-wrap i { background: #1f713c; }
.top3-item.rank-2 .bar-wrap i { background: #4a9a62; }
.top3-item.rank-3 .bar-wrap i { background: #8cc89b; }

.quality-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 12px 0;
    border-bottom: 1px solid #edf1ed;
    gap: 15px;
}
.quality-row:last-child { border-bottom: none; }
.quality-row .name { color: #536057; font-size: 14px; }
.quality-row .val  { font-weight: 700; color: #173d26; }
.quality-row.manquante .val { color: #a8442b; }

.action-card {
    display: flex;
    gap: 14px;
    padding: 18px;
    background: #eef6ef;
    border: 1px solid #d6e7d8;
    border-radius: 11px;
    margin-bottom: 14px;
}
.action-card:last-child { margin-bottom: 0; }
.action-card .icon {
    font-size: 20px;
    flex-shrink: 0;
    line-height: 1.3;
}
.action-card .label {
    font-size: 12px;
    color: #2d7343;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
}
.action-card .txt { font-size: 14px; color: #2b3a30; line-height: 1.5; }

.conseil-item {
    display: flex;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid #edf1ed;
    font-size: 14px;
    color: #3a4a3f;
}
.conseil-item:last-child { border-bottom: none; }
.conseil-item .dot { color: #318049; flex-shrink: 0; }

.detail-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}
.detail-table th {
    text-align: left;
    padding: 10px 8px;
    border-bottom: 2px solid #dfe8e0;
    color: #536057;
    font-weight: 700;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
}
.detail-table th:not(:first-child) { text-align: right; }
.detail-table td {
    padding: 12px 8px;
    border-bottom: 1px solid #edf1ed;
    vertical-align: top;
}
.detail-table td:not(:first-child) { text-align: right; }
.detail-table .co2e { font-weight: 700; color: #173d26; }
.detail-table .qualite {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    text-transform: capitalize;
}
.q-confirmee  { background: #e3f3e7; color: #1f6d3a; }
.q-declaree   { background: #eef3f0; color: #536057; }
.q-estimee    { background: #fdf3d9; color: #8a6b13; }
.q-manquante  { background: #fbe0d8; color: #a8442b; }

.detail-table .note {
    display: block;
    font-size: 11px;
    color: #8a938c;
    font-style: italic;
    margin-top: 3px;
}

.print-only { display: none; }

.print-signature {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid #ccc;
    font-size: 11px;
    color: #6a756d;
    display: flex;
    justify-content: space-between;
}

.pdf-button {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 13px 22px;
    border: none;
    border-radius: 9px;
    background: #1f713c;
    color: white;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
}
.pdf-button:hover { background: #185c31; transform: translateY(-1px); }


/* =========================================
   IMPRESSION / PDF
   ========================================= */

@media print {

    @page { margin: 14mm 12mm; size: A4; }

    * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
    }

    body {
        background: white !important;
        color: #17251c !important;
        font-size: 12px;
    }

    .no-print { display: none !important; }
    .print-only { display: block !important; }

    .form-page {
        width: 100% !important;
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
    }

    .form-card {
        box-shadow: none !important;
        border: 1px solid #d4dcd5 !important;
        page-break-inside: avoid;
        break-inside: avoid;
        margin-bottom: 12px !important;
        padding: 18px !important;
    }

    .form-intro { margin-bottom: 18px !important; padding: 0 !important; }

    .report-hero {
        page-break-inside: avoid;
        break-inside: avoid;
        margin-bottom: 12px !important;
        padding: 24px 22px !important;
    }

    .report-hero .big-value { font-size: 48px !important; }

    .detail-table { font-size: 11px; }
    .detail-table td, .detail-table th { padding: 7px 5px; }

    .action-card,
    .quality-row,
    .conseil-item,
    .top3-item { page-break-inside: avoid; }

    a { color: inherit !important; text-decoration: none !important; }

    .print-signature { display: flex !important; }
}

</style>
</head>
<body>

<header class="navbar no-print">
    <div class="logo"><span>🌿</span> Passeport Carbone</div>
    <a href="index.html" class="nav-button">Accueil</a>
</header>

<main class="form-page">

    <div class="print-only" style="margin-bottom:18px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #267a42;padding-bottom:10px;margin-bottom:4px">
            <strong style="font-size:16px;color:#173d26">🌿 Passeport Carbone</strong>
            <span style="font-size:11px;color:#6a756d">Rapport mensuel d'émissions</span>
        </div>
    </div>

    <div class="progress-container no-print">
        <div class="progress-info">
            <span>Parcours d'évaluation</span>
            <strong>Étape 3 sur 3 — Rapport</strong>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width:100%"></div></div>
    </div>

    <div id="rapport">
        <p style="color:#7a857d;text-align:center;padding:40px 0">Chargement du rapport…</p>
    </div>

</main>

<script src="facteurs.js"></script>
<script src="sources.js"></script>
<script src="calcul.js"></script>
<script>
(function () {

    const KEY_EVAL    = "passeportCarboneEvaluation";
    const KEY_HISTORY = "passeportCarboneHistorique";

    const $rapport = document.getElementById("rapport");

    const stored = localStorage.getItem(KEY_EVAL);
    if (!stored) {
        $rapport.innerHTML = messageVide(
            "Aucune évaluation trouvée",
            "Veuillez d'abord effectuer une évaluation mensuelle.",
            "formulaire.html",
            "Commencer un bilan"
        );
        return;
    }

    let donnees;
    try { donnees = JSON.parse(stored); }
    catch {
        $rapport.innerHTML = messageVide("Données illisibles", "Le stockage local est corrompu.");
        return;
    }

    if (!donnees.secteur || !donnees.valeurs) {
        $rapport.innerHTML = messageVide(
            "Évaluation incomplète",
            "Le secteur ou les valeurs sont manquants.",
            "formulaire.html",
            "Reprendre le bilan"
        );
        return;
    }

    const report = window.PasseportCarboneCalcul.calculerBilanMensuel(donnees);

    if (!report) {
        $rapport.innerHTML = messageVide("Calcul impossible", "Le moteur n'a pas pu traiter les données.");
        return;
    }

    let hist = {};
    try { hist = JSON.parse(localStorage.getItem(KEY_HISTORY)) || {}; } catch {}
    const prev = getRapportMoisPrecedent(donnees, hist);

    hist[`${donnees.secteur}-${donnees.mois}`] = {
        mois: donnees.mois,
        secteur: donnees.secteur,
        total_co2e_kg: report.total_co2e_kg,
        total_biogenic_kg: report.total_biogenic_kg,
        date: new Date().toISOString()
    };
    try { localStorage.setItem(KEY_HISTORY, JSON.stringify(hist)); } catch {}

    $rapport.innerHTML = rendreRapport(report, donnees, prev);

    const btnPdf = document.getElementById("btn-pdf");
    if (btnPdf) {
        btnPdf.addEventListener("click", () => window.print());
    }

})();


function messageVide(titre, texte, lien, labelLien) {
    return `
        <section class="form-card">
            <div class="form-header">
                <span class="form-number">⚠️</span>
                <h2>${titre}</h2>
                <p>${texte}</p>
            </div>
            ${lien ? `<a href="${lien}" class="primary-button">${labelLien || "Continuer"}</a>` : ""}
        </section>`;
}

function formatKg(kg, forceTonnes) {
    if (!Number.isFinite(kg) || kg === 0) return "0 kg";
    if (forceTonnes || kg >= 1000) {
        return (kg / 1000).toLocaleString("fr-FR", { maximumFractionDigits: 2 }) + " t";
    }
    return kg.toLocaleString("fr-FR", { maximumFractionDigits: 1 }) + " kg";
}

function formatMois(mois) {
    if (!mois || !mois.includes("-")) return mois || "—";
    const [y, m] = mois.split("-").map(Number);
    const date = new Date(y, m - 1);
    const str = date.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
    return str.charAt(0).toUpperCase() + str.slice(1);
}

function nomSecteur(id) {
    return (SECTEURS_META[id] && SECTEURS_META[id].nom) || id || "—";
}

function getRapportMoisPrecedent(donnees, hist) {
    const [y, m] = donnees.mois.split("-").map(Number);
    const py = m === 1 ? y - 1 : y;
    const pm = m === 1 ? 12 : m - 1;
    const prevMois = `${py}-${String(pm).padStart(2, "0")}`;
    return hist[`${donnees.secteur}-${prevMois}`] || null;
}

function formatActivite(d) {
    const i = d.input;
    if (!i) return "—";

    switch (i.kind) {
        case "combustible": {
            const q = i.quantite;
            if (i.facteurId === "propane") return `${q} kg GPL`;
            if (i.facteurId === "bois" || i.facteurId === "charbon_bois") return `${q} kg`;
            if (i.facteurId === "fioul") return `${q} kg fioul`;
            return `${q} L`;
        }
        case "electricite":
            if (i.kwh != null) return `${i.kwh} kWh`;
            if (i.fcfa != null) return `${i.fcfa.toLocaleString("fr-FR")} FCFA (estimé)`;
            return "—";
        case "fluide":
            return `${i.masse} kg ${i.typeFluide ? FACTEURS_FRIGORIGENES[i.typeFluide].nom : ""}`.trim();
        case "ciment":
            return `${i.masseKg} kg ciment`;
        case "elevage":
            return `${i.nombre} tête(s)`;
        case "fumier":
            return i.mode ? i.mode : "pratique déclarée";
        case "engrais":
            return i.masseKg + " kg " + (FACTEURS_ENGRAIS[i.produitId] ? FACTEURS_ENGRAIS[i.produitId].nom : "");
        case "dechets":
            return (i.masseKg ? i.masseKg + " kg — " : "") + (i.destination || "destination non précisée");
        default:
            return "—";
    }
}


/* =========================================
   ÉQUIVALENCE CONCRÈTE
   1 t CO2e ≈ 366 L de diesel brûlés
   (facteur diesel moteur = 2,73 kg CO2e/L)
   ========================================= */

function equivalenceConcrete(totalKg) {
    const litres = Math.round(totalKg / 2.73);
    if (litres < 20) return null;
    return {
        litres: litres,
        texte: `équivalent à environ ${litres.toLocaleString("fr-FR")} litres de diesel brûlés`
    };
}


function rendreRapport(report, donnees, prev) {

    const totalOp = report.total_co2e_kg;
    const totalBio = report.total_biogenic_kg;
    const niveau = report.niveau;

    let deltaHtml = "";
    if (prev) {
        const d = totalOp - prev.total_co2e_kg;
        const pct = prev.total_co2e_kg > 0 ? (d / prev.total_co2e_kg) * 100 : 0;
        let classe = "flat";
        let fleche = "→";
        if (d < -0.5) { classe = "down"; fleche = "↓"; }
        else if (d > 0.5) { classe = "up"; fleche = "↑"; }
        const absStr = formatKg(Math.abs(d));
        const signe = d > 0 ? "+" : (d < 0 ? "−" : "");
        deltaHtml = `
            <span class="delta ${classe}">
                ${fleche} ${signe}${absStr}
                ${prev.total_co2e_kg > 0 ? ` (${pct > 0 ? "+" : ""}${pct.toFixed(0)} %)` : ""}
                vs ${formatMois(prev.mois)}
            </span>`;
    } else {
        deltaHtml = `<span class="delta flat">→ Premier bilan enregistré pour ce secteur</span>`;
    }

    const bioHtml = totalBio > 0 ? `
        <div class="biogenic">
            <div>
                <div class="val">${formatKg(totalBio)}</div>
                <div class="txt">CO₂ biogénique (bois / charbon de bois) — reporté séparément du total opérationnel</div>
            </div>
        </div>` : "";

    /* Équivalence concrète */
    const eq = equivalenceConcrete(totalOp);
    const eqHtml = eq ? `
        <p style="color:#536057;font-size:13px;margin-top:16px;line-height:1.55">
            Ordre de grandeur : ce bilan mensuel correspond à <strong>${eq.texte}</strong>.
        </p>` : "";

    let top3Html = "";
    if (report.top3.length === 0) {
        top3Html = `<p style="color:#7a857d;padding:10px 0">Aucune source calculable ce mois-ci.</p>`;
    } else {
        top3Html = report.top3.map((d, idx) => {
            const pct = totalOp > 0 ? (d.co2e / totalOp) * 100 : 0;
            return `
                <div class="top3-item rank-${idx + 1}">
                    <span class="label">${idx + 1}. ${echapper(d.label)}</span>
                    <span class="value">${formatKg(d.co2e)}</span>
                    <div class="bar-wrap"><i style="width:${Math.min(pct,100).toFixed(1)}%"></i></div>
                    <span class="pct">${pct.toFixed(1)} % du total opérationnel</span>
                </div>`;
        }).join("");
    }

    const q = report.qualityShare;
    const qc = report.qualityCounts;
    const qualiteHtml = `
        <div class="quality-row">
            <span class="name">Confirmée <small style="color:#8a938c">(factures, reçus, relevés)</small></span>
            <span class="val">${(q.confirmee * 100).toFixed(0)} %</span>
        </div>
        <div class="quality-row">
            <span class="name">Déclarée <small style="color:#8a938c">(sans justificatif)</small></span>
            <span class="val">${(q.declaree * 100).toFixed(0)} %</span>
        </div>
        <div class="quality-row">
            <span class="name">Estimée <small style="color:#8a938c">(conversion, FCFA)</small></span>
            <span class="val">${(q.estimee * 100).toFixed(0)} %</span>
        </div>
        <div class="quality-row manquante">
            <span class="name">Sources manquantes</span>
            <span class="val">${qc.manquante || 0}</span>
        </div>`;

    const actionsHtml = report.actions.map(a => `
        <div class="action-card">
            <div class="icon">✓</div>
            <div>
                <div class="label">${echapper(a.source)}</div>
                <div class="txt">${echapper(a.texte)}</div>
            </div>
        </div>`).join("");

    let conseilsHtml = "";
    if (report.conseilsSecteur.length > 0) {
        conseilsHtml = report.conseilsSecteur.map(c => `
            <div class="conseil-item">
                <span class="dot">•</span>
                <span>${echapper(c)}</span>
            </div>`).join("");
    }

    const detailsTries = [...report.details].sort((a, b) => b.co2e - a.co2e);
    const detailHtml = detailsTries.map(d => {
        const note = d.note ? `<span class="note">${echapper(d.note)}</span>` : "";
        return `
            <tr>
                <td>${echapper(d.label)}${note}</td>
                <td>${echapper(formatActivite(d))}</td>
                <td class="co2e">${d.co2e > 0 ? formatKg(d.co2e) : "—"}</td>
                <td><span class="qualite q-${d.qualite}">${d.qualite}</span></td>
            </tr>`;
    }).join("");

    const dateImpression = new Date().toLocaleDateString("fr-FR", {
        day: "2-digit", month: "long", year: "numeric"
    });

    return `
        <section class="form-intro no-print">
            <span class="section-label">🌍 RAPPORT CARBONE MENSUEL</span>
            <h1>Votre bilan <span>carbone.</span></h1>
            <p>${echapper(report.nom || "PME")} — ${echapper(formatMois(report.mois))} — ${echapper(nomSecteur(report.secteur))}</p>
        </section>

        <!-- HERO -->
        <section class="report-hero">
            <div class="label">Émissions opérationnelles du mois</div>
            <div class="big-value">${formatKg(totalOp, true).replace(/ t$/, "")}<span class="big-unit">t CO₂e</span></div>
            <div class="sub">${echapper(report.nom || "PME")} — ${echapper(formatMois(report.mois))}</div>
            ${bioHtml}
            <div>${deltaHtml}</div>
        </section>

        <!-- NIVEAU + TRANSPARENCE -->
        <section class="form-card">
            <div class="niveau-badge niveau-${niveau.niveau}">${niveau.titre}</div>
            <p style="color:#536057;font-size:14px;margin:0">${echapper(niveau.message)}</p>
            ${eqHtml}
            <div class="note-transparence">
                Ces seuils sont indicatifs et sectoriels. Ils situent votre bilan par rapport à des ordres de grandeur d'activité usuels pour les PME burkinabè, mais ne constituent pas une norme nationale ni une évaluation de votre performance environnementale.
            </div>
        </section>

        <!-- TOP 3 -->
        <section class="form-card">
            <div class="form-header">
                <span class="form-number">01</span>
                <h2>Vos 3 principales sources</h2>
                <p>Postes d'émission les plus significatifs du mois.</p>
            </div>
            ${top3Html}
        </section>

        <!-- QUALITÉ -->
        <section class="form-card">
            <div class="form-header">
                <span class="form-number">02</span>
                <h2>Qualité des données</h2>
                <p>Part des émissions selon la fiabilité des informations saisies.</p>
            </div>
            ${qualiteHtml}
        </section>

        <!-- ACTIONS -->
        <section class="form-card">
            <div class="form-header">
                <span class="form-number">03</span>
                <h2>Actions prioritaires</h2>
                <p>Une à deux pistes concrètes à mettre en œuvre dès ce mois.</p>
            </div>
            ${actionsHtml}
        </section>

        <!-- CONSEILS SECTEUR -->
        ${conseilsHtml ? `
        <section class="form-card">
            <div class="form-header">
                <span class="form-number">04</span>
                <h2>Conduite à tenir pour votre secteur</h2>
            </div>
            ${conseilsHtml}
        </section>` : ""}

        <!-- DÉTAIL -->
        <section class="form-card">
            <div class="form-header">
                <span class="form-number">05</span>
                <h2>Détail par source</h2>
                <p>Récapitulatif complet des données déclarées ce mois-ci.</p>
            </div>
            <div style="overflow-x:auto">
                <table class="detail-table">
                    <thead>
                        <tr>
                            <th>Source</th>
                            <th>Activité</th>
                            <th>CO₂e</th>
                            <th>Qualité</th>
                        </tr>
                    </thead>
                    <tbody>${detailHtml}</tbody>
                </table>
            </div>
            ${totalBio > 0 ? `
            <p style="margin-top:14px;font-size:12px;color:#7a857d;font-style:italic">
                Note : le CO₂ biogénique issu de la combustion du bois et du charbon de bois (${formatKg(totalBio)} ce mois) est reporté séparément et n'est pas inclus dans le total opérationnel ci-dessus.
            </p>` : ""}
        </section>

        <!-- MÉTHODO -->
        <section class="form-card">
            <div class="form-header">
                <span class="form-number">06</span>
                <h2>À propos de cette estimation</h2>
            </div>
            <p style="color:#536057;font-size:13px;line-height:1.6">
                Ce rapport est calculé selon la méthode <em>donnée d'activité × facteur d'émission</em>,
                conformément aux lignes directrices GIEC 2006. Les facteurs utilisés sont stockés avec leur
                année de référence, leur source et leur statut.
                <br><br>
                Certaines sources (déchets organiques, gestion du fumier, réseaux de chaleur/froid) sont
                enregistrées mais non quantifiées tant que des facteurs représentatifs du contexte burkinabè
                ne sont pas disponibles. Le ciment repose sur un facteur provisoire.
                <br><br>
                Ce rapport est un outil de suivi. Il ne constitue pas un bilan réglementaire ni un audit.
            </p>
        </section>

        <!-- SIGNATURE PRINT -->
        <div class="print-signature">
            <span>Passeport Carbone — Prototype de recherche</span>
            <span>Édité le ${dateImpression}</span>
        </div>

        <!-- ACTIONS -->
        <section class="form-card no-print">
            <div class="form-actions">
                <a href="detail.html" class="back-button">← Modifier les données</a>
                <button type="button" id="btn-pdf" class="pdf-button">📄 Télécharger le PDF</button>
            </div>
            <p style="margin-top:14px;font-size:13px;color:#7a857d;text-align:center">
                Nouvelle évaluation ? <a href="formulaire.html" style="color:#267a42;text-decoration:underline">Reprendre depuis le début</a>
            </p>
        </section>
    `;
}

function echapper(texte) {
    return String(texte == null ? "" : texte)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

</script>
</body>
